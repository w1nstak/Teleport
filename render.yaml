services:
  - type: web
    name: teleport-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /data
      - key: WEB_DIR
        value: /app/web
      - key: SMS_PROVIDER
        value: mock
      - key: PUBLIC_URL
        sync: false
    disk:
      name: teleport-data
      mountPath: /data
      sizeGB: 1
