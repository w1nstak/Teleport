name: Build Teleport IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          cat > project.yml << 'EOF'
          name: Teleport
          options:
            bundleIdPrefix: com.teleport
            deploymentTarget:
              iOS: "16.0"
          targets:
            Teleport:
              type: application
              platform: iOS
              sources:
                - Teleport
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.teleport.messenger
                  MARKETING_VERSION: "1.0.0"
                  CURRENT_PROJECT_VERSION: "1"
                  INFOPLIST_FILE: ""
                  GENERATE_INFOPLIST_FILE: "YES"
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGN_IDENTITY: ""
              dependencies:
                - package: TDLibKit
          packages:
            TDLibKit:
              url: https://github.com/nicklama/TDLibKit
              from: "1.0.0"
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild build \
            -project Teleport.xcodeproj \
            -scheme Teleport \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -50

      - name: Build for iOS Device (unsigned)
        run: |
          xcodebuild build \
            -project Teleport.xcodeproj \
            -scheme Teleport \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -50 || true

      - name: Create IPA
        run: |
          APP_PATH=$(find build -name "Teleport.app" -path "*Release-iphoneos*" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "Teleport.app" | head -1)
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Teleport.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Teleport-IPA
          path: Teleport.ipa
