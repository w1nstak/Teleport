name: Build Teleport IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create project spec
        run: |
          cat > project.yml << 'EOF'
          name: Teleport
          options:
            bundleIdPrefix: com.teleport
            deploymentTarget:
              iOS: "16.0"
            xcodeVersion: "15.4"
          settings:
            base:
              CODE_SIGNING_ALLOWED: "NO"
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: "NO"
          targets:
            Teleport:
              type: application
              platform: iOS
              sources:
                - path: Teleport
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.teleport.messenger
                  MARKETING_VERSION: "1.0.0"
                  CURRENT_PROJECT_VERSION: "1"
                  GENERATE_INFOPLIST_FILE: "YES"
                  SWIFT_VERSION: "5.9"
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project Teleport.xcodeproj \
            -scheme Teleport \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "Teleport.app" | head -1)
          echo "App found at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Teleport.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Teleport-IPA
          path: Teleport.ipa
