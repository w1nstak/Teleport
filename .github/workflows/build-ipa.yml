name: Build Teleport IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -scheme Teleport -project Teleport.xcodeproj

      - name: Build for iOS (unsigned)
        run: |
          xcodebuild build \
            -project Teleport.xcodeproj \
            -scheme Teleport \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Teleport.app Payload/
          zip -r Teleport.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Teleport-IPA
          path: Teleport.ipa
