name: Build Teleport IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create project.yml
        run: |
          cat > project.yml << 'SPEC'
          name: Teleport
          options:
            bundleIdPrefix: com.teleport
            deploymentTarget:
              iOS: "16.0"
          settings:
            base:
              CODE_SIGNING_ALLOWED: "NO"
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: "NO"
          targets:
            Teleport:
              type: application
              platform: iOS
              sources:
                - path: Teleport
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.teleport.messenger
                  MARKETING_VERSION: "1.0.0"
                  CURRENT_PROJECT_VERSION: "1"
                  GENERATE_INFOPLIST_FILE: "YES"
                  SWIFT_VERSION: "5.9"
          SPEC

      - name: Generate and patch Xcode project
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/' Teleport.xcodeproj/project.pbxproj

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Teleport.xcodeproj \
            -scheme Teleport \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
        continue-on-error: true

      - name: Show errors
        if: failure() || always()
        run: |
          echo "=== BUILD ERRORS ==="
          grep "error:" build.log | head -50 || echo "No error lines found"

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "Teleport.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found, build failed"
            exit 1
          fi
          echo "App at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Teleport.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Teleport-IPA
          path: Teleport.ipa
